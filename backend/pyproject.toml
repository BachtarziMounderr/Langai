[build-system]
requires = ["setuptools>=80,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "lingua-ai-backend"
version = "0.1.0"
description = "FastAPI entry point for the Lingua AI modular monolith"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.0.54",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "argon2-cffi==25.1.0",
  "PyJWT==2.15.1",
  "httpx==0.28.1",
  "google-genai==2.28.0",
]

[project.optional-dependencies]
dev = [
  "ruff==0.16.9",
  "pre-commit==4.6.2",
  "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ANN001", "ANN201", "DTZ", "T20"]
